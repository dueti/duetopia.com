<div id="pw-gate" data-slug="{{ .File.UniqueID }}" style="margin:2em 0;padding:1.5em;border:1px solid var(--border);border-radius:6px;">
  <p style="margin-top:0;">本文需要密码访问，请向作者索取后输入。</p>
  <div style="display:flex;gap:.5em;flex-wrap:wrap;">
    <input type="password" id="pw-input" placeholder="访问密码" autofocus style="flex:1;min-width:200px;padding:.5em .75em;border:1px solid var(--border);border-radius:4px;background:var(--theme);color:var(--primary);font:inherit;">
    <button id="pw-submit" type="button" style="padding:.5em 1.25em;border:none;border-radius:4px;background:var(--primary);color:var(--theme);cursor:pointer;font:inherit;">解锁</button>
  </div>
  <p id="pw-error" hidden style="color:#c0392b;margin-bottom:0;">密码错误，请重试。</p>
</div>
<template id="encrypted-region">{{ .Content }}</template>
<div id="encrypted-payload" data-encrypted="ENCRYPT_PLACEHOLDER" hidden></div>
<div id="decrypted-content" class="post-content" hidden></div>
<script src="/js/password-decrypt.js" defer></script>
